<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタムチケットバッジ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      margin: 0;
    }

    /* 入力フォームエリア */
    .controls {
      margin-bottom: 20px;
    }
    
    .controls label {
      font-size: 14px;
      color: #333;
      display: block;
      margin-bottom: 5px;
    }

    .controls input {
      font-size: 16px;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 200px;
    }

    /* バッジのデザイン */
    .ticket-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 160px;
      height: 120px;
      background-color: #cb9b33;
      border-radius: 12px;
      color: #ffffff;
      font-weight: 800;
      font-size: 48px;
      letter-spacing: 1px;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- 入力フォーム -->
  <div class="controls">
    <label for="text-input">表示する文字を変更:</label>
    <input type="text" id="text-input" value="S-4" placeholder="例: A-12">
  </div>

  <!-- バッジ部分 -->
  <div class="ticket-badge" id="badge-text">S-4</div>

  <script>
    const input = document.getElementById('text-input');
    const badge = document.getElementById('badge-text');

    // 入力内容に合わせてバッジの文字を更新
    input.addEventListener('input', (e) => {
      badge.textContent = e.target.value;
    });
  </script>

</body>
</html>
